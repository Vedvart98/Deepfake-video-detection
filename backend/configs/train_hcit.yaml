# Training Configuration for HCiT on FaceForensics++ + Celeb-DF
model:
  name: "HCiT-ResNet50-DeiT-S"
  num_classes: 2
  pretrained: true
  cnn_freeze_layers: 0  # Start with all layers trainable

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.00001
  scheduler: "cosine"
  warmup_epochs: 5
  early_stopping_patience: 10
   
optimizer:
  type: "AdamW"
  betas: [0.9, 0.999]
   
augmentation:
  random_horizontal_flip: 0.5
  random_rotation: 15
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
  gaussian_blur: 0.1

data:
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - auc_roc
    - auc_pr
